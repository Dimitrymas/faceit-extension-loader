name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test-and-build:
    name: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Windows cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows Setup
        run: npm run build:win-installer

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v7
        with:
          name: addonport-for-faceit-${{ github.sha }}
          path: |
            dist/AddonPort-for-FACEIT-Setup-*-x64.exe
            dist/AddonPort-for-FACEIT-Setup-*-x64.exe.sha256
          if-no-files-found: error
          retention-days: 7
