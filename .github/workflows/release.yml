name: Versioned Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build-unsigned-signing-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Validate tag and package version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "$PACKAGE_VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Windows cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: |
          npm test
          npm run build:win-installer

      - name: Upload unsigned signing candidate
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-addonport-for-faceit-${{ steps.version.outputs.value }}
          path: dist/AddonPort-for-FACEIT-Setup-${{ steps.version.outputs.value }}-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Summarize manual signing step
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Signing required

          Download the \`unsigned-addonport-for-faceit-${VERSION}\` artifact on the trusted Windows
          signing machine. Run \`scripts/sign-windows-release.ps1\`, verify the Authenticode timestamp,
          then publish with \`scripts/publish-signed-release.ps1\`.
          EOF
