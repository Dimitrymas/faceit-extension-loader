name: Development Release

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: development-release
  cancel-in-progress: true

jobs:
  publish:
    name: publish-dev-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Windows cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64

      - name: Install dependencies
        run: npm ci

      - name: Set development version
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version.split('-')[0]")
          DEV_VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}"
          npm version "$DEV_VERSION" --no-git-tag-version
          echo "value=$DEV_VERSION" >> "$GITHUB_OUTPUT"

      - name: Test and build
        run: |
          npm test
          npm run build:win-installer

      - name: Replace rolling development release
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_VERSION: ${{ steps.version.outputs.value }}
        run: |
          EXE="dist/AddonPort-for-FACEIT-Setup-${DEV_VERSION}-x64.exe"
          CHECKSUM="${EXE}.sha256"
          SHORT_SHA=${GITHUB_SHA::7}
          cat > dev-release-notes.md <<EOF
          ## Development build

          Built from [\`${SHORT_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) on the \`dev\` branch.

          ### Verification

          - Passed the repository test suite.
          - Built the self-contained Windows x64 Setup and SHA-256 checksum.

          > This artifact is unsigned, mutable, and intended for testing. Use a versioned release for reproducible distribution.
          EOF
          gh release delete dev-latest --cleanup-tag --yes || true
          git push origin :refs/tags/dev-latest || true
          gh release create dev-latest "$EXE" "$CHECKSUM" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "AddonPort for FACEIT development build ${DEV_VERSION}" \
            --notes-file dev-release-notes.md
